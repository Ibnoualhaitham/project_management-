{% extends 'base.html' %}

{% block title %} Confirm Delete {% endblock %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg border-danger">
        <div class="card-header bg-danger text-white">
            <h2 class="card-title mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Delete</h2>
        </div>
        <div class="card-body">
            <p class="card-text">Are you sure you want to delete <strong>{{ object }}</strong>?</p>
            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash-fill me-1"></i> Confirm Delete</button>
                    <a href="{% url 'project_list' %}" class="btn btn-secondary"><i class="bi bi-x-circle me-1"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
